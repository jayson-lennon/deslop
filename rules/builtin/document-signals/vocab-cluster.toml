# Authored: vocabulary-density cluster metric. The watch list is "fine
# individually; a cluster in one paragraph is a tell" (anti-ai-tell
# density_watch). This rule fires only on clusters, complementing the
# per-word vocab rule (which users typically set to "allow").
# Threshold 4 = 5 distinct terms in one paragraph (tuned: 382-term
# list includes ordinary words; weak clusters are uninformative).
id-base = "DOC-METRIC-VOCAB-CLUSTER"
kind = "metric"
tier = 3
category = "vocabulary-density"
stat = "term_cluster_max"
window = "paragraph"
threshold_gt = 4
