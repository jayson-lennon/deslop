# Hand-authored Tier-3 metric rule: sentence-length-monotony.
# Thresholds marked `# TODO tune` are provisional; phase-6 triage tunes them.
# Floors (metrics.rs): <250 words skips ratio stats; <20 quotes skips the
# quote ratio; <6 sentences skips sent_len_cv.

id-base = "DOC-METRIC-SENTENCE-LENGTH-MONOTONY"
kind = "metric"
tier = 3
category = "document-signals"
message = "Sentence-length coefficient of variation {value}"
advice = "Uniform sentence lengths produce an even, synthetic cadence; combine some sentences and split others for rhythm (# TODO tune)"
scope = "anywhere"

stat = "sent_len_cv"
per_words = 1
threshold_gt = 0.75

[url]
text = "Wikipedia:Signs of AI writing § Style"
href = "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style"


[fixtures]
must_match = []   # metric rules are aggregate-only; fixture eval exempt
must_not_match = []

