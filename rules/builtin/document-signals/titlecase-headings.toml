# Hand-authored Tier-3 metric rule: titlecase-headings.
# Thresholds marked `# TODO tune` are provisional; phase-6 triage tunes them.
# Floors (metrics.rs): <250 words skips ratio stats; <20 quotes skips the
# quote ratio; <6 sentences skips sent_len_cv.

id-base = "DOC-METRIC-TITLECASE-HEADINGS"
kind = "metric"
tier = 3
category = "document-signals"
message = "{value:.0%} of headings are Title Case"
advice = "Headings read like report chapters (Impact of Technology And Digitalization); prefer sentence case matching surrounding prose (# TODO tune)"
scope = "anywhere"

stat = "heading_titlecase_fraction"
per_words = 1
threshold_gt = 0.5

[url]
text = "Wikipedia:Signs of AI writing § Style"
href = "https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style"


[fixtures]
must_match = []   # metric rules are aggregate-only; fixture eval exempt
must_not_match = []

