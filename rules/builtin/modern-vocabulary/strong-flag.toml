# Authored: seed per-instance lints (golden-test anchors). These measured
# strong-flag words stay individually lintable; the rest of the single-word
# vocabulary lives in the vocab-cluster metric.
id-base = "MODERN-VOCAB-STRONG-FLAG"
kind = "vocab"
tier = 2
category = "ai-vocabulary"
enabled = true

[[entries]]
slug = "leverage-fix-14"
advice = 'Replace "{match}" with its plain verb ("use") — nominalized business-speak is a top frequency signal in Kobak 2025'
terms = ["leverage"]
replacement = "use"

[[entries]]
slug = "testament-fix-22"
advice = 'Admiration formula ("a testament to"); state what it demonstrates'
terms = ["testament"]
replacement = "proof"

[[entries]]
slug = "transformative-fix-23"
advice = 'Strong AI tell; one use is worth flagging'
terms = ["transformative"]
replacement = "big"

