# deslop pack: aisigns - this project (WP:AISIGNS artifacts + document metrics)

[[group]]
id-base = 'AISIGNS'
kind = 'literal-ban'
tier = 1
category = 'referral-urls'
message = 'Chatbot markup artifact'
scope = 'anywhere'

[group.url]
text = 'Wikipedia:Signs of AI writing'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Markup'

[[group.entries]]
slug = 'chatgpt-referral'
advice = 'Delete the ChatGPT/Copilot referral query - the URL was copied from an LLM share/citation flow, not typed by a human'
terms = [
    'utm_source=chatgpt.com',
    'utm_source=chat.openai.com',
    'utm_source=copilot.microsoft.com',
    '?referrer=grok.com',
    '&referrer=grok.com',
    '?output=1&prof=1',
]
category = 'referral-urls'

[[group.entries]]
slug = 'didactic-disclaimer'
advice = "Drop the chatbot's didactic sign-off (consult a professional for…) or convert it to a genuine editorial note addressed to the reader"
terms = [
    'always consult with a qualified',
    'it is important to note that i am not',
]
category = 'assistant-disclaimer'

[[group.entries]]
slug = 'gemini-cite'
advice = "Replace Gemini's rendered `[cite: N]` / `[cite_start]` scaffold with a proper reference or remove it"
terms = [
    '[cite: {N}, {N}, {N}, {N}]',
    '[cite: {N}, {N}, {N}]',
    '[cite: {N}, {N}]',
    '[cite: {N}]',
    '[cite_start]',
    '[cite_end]',
]
category = 'gemini-artifacts'

[[group.entries]]
slug = 'grok-cards'
advice = 'Remove the raw Grok render callout (`grok_render_citation_card_json`) - internal UI instructions leaked into output text'
terms = [
    'grok_render_citation_card_json',
    "{{\"citation_cards\"",
    "\"render_citation_card\"",
]
category = 'grok-artifacts'

[[group.entries]]
slug = 'knowledge-cutoff'
advice = 'Delete the assistant preamble about my knowledge cutoff / not having real-time data - a chat-transcript opener that leaked into the document'
terms = [
    'my knowledge cutoff',
    'as of my last update',
    'as an ai language model, i',
    'i cannot browse the internet in real time',
]
category = 'assistant-preamble'

[[group.entries]]
slug = 'lenticular-dagger'
advice = 'DeepSeek-style †/‡ dagger chains left where citations should be - use real references or nothing'
terms = ['†††††', '††††', '[citation: {N}]']
category = 'deepseek-daggers'

[[group.entries]]
slug = 'oaicite'
advice = 'Delete the raw ChatGPT citation wrapper (`contentReference[oaicite:N]{index=N}`) - paste-converted markup that never belonged in prose; re-cite properly or drop the claim'
terms = [
    'contentReference[oaicite:{N}]{{index={N}}}',
    '[oaicite:{N}]',
    'attributableIndex',
]
category = 'chatgpt-artifacts'

[[group.entries]]
slug = 'perplexity'
advice = 'Strip the Perplexity artifact ([attached_file:N]/[webpage:N]) - sandbox plumbing, not citation; reference the source by name instead'
terms = ['[attached_file:{N}]', '[webpage:{N}]', '[webpage_content]']
category = 'perplexity-artifacts'

[[group.entries]]
slug = 'leaked-search-pointer'
advice = 'Delete the `turn0searchN` web-search pointer - leaked ChatGPT tool state, not content; replace with a real citation or nothing'
terms = [
    'turn0search{N}',
    'turn0view{N}',
    'turn0news{N}',
    'turn0image{N}',
    'tool_uses_remaining:',
    '_processed_image_ids',
    '|^12^|',
]
category = 'chatgpt-artifacts'

[[group.entries]]
slug = 'unfilled-placeholder'
advice = "This template placeholder was never filled in ('[Your Name]', 'url=URL', 'PASTE_X_HERE', 'INSERT_X') - complete the value or delete the scaffolding line"
terms = [
    '[your name]',
    '[client name]',
    '[company name]',
    '[insert {N} words]',
    'url=url ',
    'url=paste_spotify_track_url_here',
    'title=title goes here',
    'paste_{N}_word_description_here',
    'insert_meta_description_here',
    '<insert here>',
    'lorem ipsum dolor sit amet, consectetur adipiscing elit',
]
category = 'placeholder-scaffolding'

