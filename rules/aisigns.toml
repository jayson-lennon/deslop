[[group]]
id-base = 'AISIGNS-METRIC-ANAPHORA-OPENERS'
kind = 'metric'
tier = 3
category = 'document-signals'
message = 'Same two-word opening repeated {value}×'
advice = "Sentences opening with the same bigram ('It can', 'This technology') form anaphora-like repetition; vary openers"
scope = 'anywhere'
stat = 'opening_ngram_repeat'
per_words = 1
threshold-gt = 2.0

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-BOLD-DENSITY'
kind = 'metric'
tier = 3
category = 'document-signals'
message = 'Bold spans at {value} per {per_words} words'
advice = 'Bold used as decoration instead of meaning; bold only genuinely pivotal terms'
scope = 'anywhere'
stat = 'bold_density'
per_words = 100
threshold-gt = 3.0

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-BULLET-BOLDLEAD'
kind = 'metric'
tier = 3
category = 'document-signals'
message = "{value:.0%} of bullets open with '**Term:**' lead-ins"
advice = 'Uniform **bold lead-in:** bullets are listicle scaffolding; vary or convert to flowing sentences'
scope = 'anywhere'
stat = 'bullet_boldlead_fraction'
per_words = 1
threshold-gt = 0.6

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-CURLY-DOUBLE-RATIO'
kind = 'metric'
tier = 3
category = 'document-signals'
message = '{value:.0%} of double quotes are curly'
advice = 'Curly-quote share {value:.0%} - chat exports carry typographic quotes; normalize to straight ASCII'
scope = 'anywhere'
stat = 'curly_double_ratio'
per_words = 1
threshold-gt = 0.3

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-EM-DASH-RATE'
kind = 'metric'
tier = 3
category = 'document-signals'
message = 'Em-dash density {value} per {per_words} words'
advice = 'Em-dash density {value}/1000 words exceeds conversational norms - reword the sentences instead; em-dashes as a default pause are a machine tell'
scope = 'anywhere'
stat = 'em_dash_rate'
per_words = 1000
threshold-gt = 6.0

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-EMOJI-DECORATION'
kind = 'metric'
tier = 3
category = 'document-signals'
message = '{value} emoji used as decoration'
advice = 'Emoji-as-formatting (🚀✨💡 headers/bullets) mirrors slide-deck styling, not prose; cut all but deliberate emphases'
scope = 'anywhere'
stat = 'emoji_decoration_count'
per_words = 1
threshold-gt = 3.0

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-SENTENCE-LENGTH-MONOTONY'
kind = 'metric'
tier = 3
category = 'document-signals'
message = 'Sentence-length variation {value} (uniform lengths)'
advice = 'Uniform sentence lengths produce an even, synthetic cadence; combine some sentences and split others for rhythm'
scope = 'anywhere'
stat = 'sent_len_cv'
per_words = 1
threshold-lt = 0.3

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-TITLECASE-HEADINGS'
kind = 'metric'
tier = 3
category = 'document-signals'
message = '{value:.0%} of headings are Title Case'
advice = 'Headings read like report chapters (Impact of Technology And Digitalization); prefer sentence case matching surrounding prose'
scope = 'anywhere'
stat = 'heading_titlecase_fraction'
per_words = 1
threshold-gt = 0.5

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'

[[group]]
id-base = 'AISIGNS-METRIC-TRICOLON-STREAK'
kind = 'metric'
tier = 3
category = 'document-signals'
message = "{value} consecutive 'X, Y, and Z' tricolon streak"
advice = 'The rhythmic three-part list repeated back-to-back is a signature cadence; break the pattern or vary list length'
scope = 'anywhere'
stat = 'tricolon_max_streak'
per_words = 1
threshold-gt = 2.0

[group.url]
text = 'Wikipedia:Signs of AI writing § Style'
href = 'https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Style'
