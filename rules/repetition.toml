# deslop pack: repetition - document-level repetition lints (near-verbatim,
# propositional similarity, content-family). Sentence/paragraph grouping via
# a shared similarity engine; propositional variant requires the
# all-MiniLM-L6-v2 model in the deslop data dir.
#
# The sentence-level variants only compare pairs within `max-distance`
# whitespace tokens of each other (default 200): long-range repeats are
# usually deliberate callbacks, while incidental restatements sit close
# together. Override per group as needed; content-family is
# deliberately distance-blind.

[[group]]
id-base = 'REPETITION-NEAR-VERBATIM'
kind = 'repetition'
tier = 2
category = 'repetition'
variant = 'near-verbatim'
threshold = 0.55
message = 'Near word-for-word repeats differing only in minor wording ({count} sentences)'
advice = 'Keep the best-specified sentence, fold in any unique details from the others, remove the rest.'
enabled = true
max-distance = 500

[group.url]
text = "Signs of AI writing"
href = "https://en.wikipedia.org/wiki/Signs_of_AI_writing#Duplication"

[group.fixtures]
must_match = []
must_not_match = []

[[group]]
id-base = 'REPETITION-PROPOSITIONAL'
kind = 'repetition'
tier = 2
category = 'repetition'
variant = 'propositional'
threshold = 0.78
message = 'The same point restated in different words without new information ({count} sentences)'
advice = 'State it once where it serves the document best, folding in any unique supporting details first.'
enabled = true
max-distance = 500

[group.url]
text = "Signs of AI writing"
href = "https://en.wikipedia.org/wiki/Signs_of_AI_writing#Duplication"

[group.fixtures]
must_match = []
must_not_match = []

[[group]]
id-base = 'REPETITION-CONTENT-FAMILY'
kind = 'repetition'
tier = 3
category = 'repetition'
variant = 'content-family'
threshold = 0.6
min-members = 2
message = 'One idea spread across {count} paragraphs instead of developed'
advice = 'Pick its natural home, fold in anything unique from the others, then rework the rest to advance new aspects of the document.'
enabled = true

[group.url]
text = "Signs of AI writing"
href = "https://en.wikipedia.org/wiki/Signs_of_AI_writing#Duplication"

[group.fixtures]
must_match = []
must_not_match = []
