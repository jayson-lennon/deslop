[[group]]
id-base = 'WSC-PAT-AUDIENCE-HEDGE'
kind = 'pattern'
tier = 2
category = 'audience-hedge'

[[group.entries]]
slug = 'main'
regex = "(?P<hedge>\\bwhether you[''’]re (?:a|an|new|just|looking|building|running)[^.!?\\n]{1,80}?\\bor\\b)\n"
advice = "\"{hedge}\" flattens the audience into a marketing segment; address THIS reader's actual situation"

[group.fixtures]
must_match = ["Whether you're a beginner or an expert, this guide helps."]
must_not_match = ['She could not decide whether the coat or the jacket suited the weather.']

[[group]]
id-base = 'WSC-PAT-COPULA-PUFFERY'
kind = 'pattern'
tier = 2
category = 'copula-puffery'

[[group.entries]]
slug = 'main'
regex = "\\bstands as an?\\b|\\bholds the distinction of\\b|\\bserves as a (?:testament|beacon|reminder|symbol|cornerstone)\\b\n"
advice = "Rewrite the construction plainly (wsc: Inflated copulas (\"stands as a\", \"serves as a testament\") replace plain \"is\" in AI prose (WP:AISIGNS; Geng & Trotta 2025))"

[group.fixtures]
must_match = ['The cathedral stands as a testament to medieval craft.']
must_not_match = ['The report stands on the desk and serves as a reference.']

[[group]]
id-base = 'WSC-PAT-DANCE-METAPHOR'
kind = 'pattern'
tier = 2
category = 'dance-metaphor'

[[group.entries]]
slug = 'main'
regex = "\\b(?:intricate|delicate|complex|careful) dance\\b\n"
advice = "Rewrite the construction plainly (wsc: The \"delicate dance between X and Y\" metaphor is a documented LLM favorite)"

[group.fixtures]
must_match = ['Negotiating the treaty required a delicate dance between allies.']
must_not_match = ["The critics praised the film's delicate balance of humor and dread."]

[[group]]
id-base = 'WSC-PAT-DESPITE-CHALLENGES'
kind = 'pattern'
tier = 2
category = 'despite-challenges'

[[group.entries]]
slug = 'main'
regex = "\\bdespite (?:its|these|their|the)\\b[^.!?\\n]{1,60}?\\b(?:faces?|faced|continues? to face|remains?)\\b[^.!?\\n]{0,40}?\\bchallenges\\b\n"
advice = "Rewrite the construction plainly (wsc: The \"Despite its X, [subject] faces challenges\" formula is a documented AI outline habit (WP:AISIGNS; Russell 2025))"

[group.fixtures]
must_match = ['Despite its modest budget, the film faces challenges few blockbusters attempt.']
must_not_match = ['Despite the rain, the picnic continued in good spirits.']

[[group]]
id-base = 'WSC-PAT-FALSE-RANGE'
kind = 'pattern'
tier = 2
category = 'false-range'

[[group.entries]]
slug = 'main'
regex = "\\bfrom [^,.;!?\\n]{2,40} to [^,.;!?\\n]{2,40}, (?:and )?from [^,.;!?\\n]{2,40} to\\b\n"
advice = "Rewrite the construction plainly (wsc: Chained \"from X to Y, from Z to W\" false ranges are a documented AI comprehensiveness gesture (WP:AISIGNS))"

[group.fixtures]
must_match = ['The course spans from baking basics to pastry arts, from grilling to sous-vide.']
must_not_match = ['The trail runs from the parking lot to the lake and back again.']

[[group]]
id-base = 'WSC-PAT-META-ANNOUNCEMENT'
kind = 'pattern'
tier = 2
category = 'meta-announcement'

[[group.entries]]
slug = 'main'
regex = "\\bthis (?:article|blog post|post|essay|guide) (?:aims|seeks) to\\b\n"
advice = "Rewrite the construction plainly (wsc: \"This article aims to explore...\" meta-announcements are ~50x more frequent in AI text (GPTZero))"

[group.fixtures]
must_match = ['This article aims to explore the history of the canal system.']
must_not_match = ['The professor asked the article aims to be cited properly, awkwardly.']

[[group]]
id-base = 'WSC-PAT-NEGATIVE-PARALLELISM'
kind = 'pattern'
tier = 2
category = 'negative-parallelism'

[[group.entries]]
slug = 'main'
regex = "\\bn(?:ot|[''’]t) (?:just|only|merely|simply|about) [^.!?\\n]{1,80}?[,;.:—–-] ?(?P<payload>(?:(?:it|this|that)[''’]s|it is|this is|that[''’]s|they[''’]re|but rather)\\b[^.!?\\n]{0,160})\n"
advice = "Drop the negation scaffold and state it positively: roughly \"{payload}\""

[group.fixtures]
must_match = ["It's not merely faster; it's transformative for the whole pipeline.", "This is not just a feature update, it's a complete rethinking of the workflow."]
must_not_match = ['We did not enjoy the film, but finished it anyway.', 'The engine is not only powerful; the brakes are excellent.']

[[group]]
id-base = 'WSC-PAT-NOT-ONLY-BUT-ALSO'
kind = 'pattern'
tier = 2
category = 'not-only-but-also'

[[group.entries]]
slug = 'main'
regex = "\\bnot only\\b[^.!?\\n]{2,80}?\\bbut also\\b\n"
advice = "Rewrite the construction plainly (wsc: \"not only... but also\" is heavily overused by LLMs of every generation (Russell 2025; WP:AISIGNS))"

[group.fixtures]
must_match = ['The update is not only faster but also more stable.']
must_not_match = ['She is the only child in the class who can also drive.']

[[group]]
id-base = 'WSC-PAT-PIVOTAL-ROLE-CLAIM'
kind = 'pattern'
tier = 2
category = 'pivotal-role-claim'

[[group.entries]]
slug = 'main'
regex = "\\bplay(?:s|ed|ing)? an? (?:crucial|pivotal|vital|key|critical|essential|significant|central|integral|major|prominent|important) (?:role|part)\\b\n"
advice = "Rewrite the construction plainly (wsc: \"plays a crucial/vital/key role\" is an AI significance cliche (WP:AISIGNS grandiose-phrase list))"

[group.fixtures]
must_match = ['Fiber plays a crucial role in digestive health.']
must_not_match = ['The crane operator played an important cassette during the demolition.']

[[group]]
id-base = 'WSC-PAT-TRAILING-PARTICIPIAL-ANALYSIS'
kind = 'pattern'
tier = 2
category = 'trailing-participial-analysis'

[[group.entries]]
slug = 'main'
regex = ",\\s+(?:further |thereby |ultimately )?(?:highlighting|underscoring|showcasing|reflecting|emphasi[sz]ing|demonstrating|signall?ing|illustrating|cementing|solidifying|reinforcing|exemplifying|epitomizing|symbolizing|embodying|heralding)\\b\n"
advice = "Rewrite the construction plainly (wsc: Trailing \", highlighting/underscoring/showcasing...\" significance clauses are the best-evidenced syntactic AI tell (Reinhart PNAS 2025; WP:AISIGNS))"

[group.fixtures]
must_match = ['The results improved by 40%, highlighting the new cache design.']
must_not_match = ['The clause returned to the committee, and the highlighting of each error was manual.']

[[group]]
id-base = 'WSC-PAT-UNFILLED-PLACEHOLDER'
kind = 'pattern'
tier = 2
category = 'unfilled-placeholder'

[[group.entries]]
slug = 'main'
regex = "\\[(?:your (?:name|username|email|company(?: name)?)|company name|insert [^\\]\\n]{2,40}|[a-z ]{0,20}goes here)\\]\n"
advice = "Rewrite the construction plainly (wsc: Unfilled template placeholders (\"[Your Name]\", \"[insert X]\") are AI draft output left incomplete (WP:AISIGNS))"

[group.fixtures]
must_match = ['Send it to [Your Name] before Friday.']
must_not_match = ['The bracketed taxon [see appendix] was already defined.']

[[group]]
id-base = 'WSC-PAT-VAGUE-ATTRIBUTION'
kind = 'pattern'
tier = 2
category = 'vague-attribution'

[[group.entries]]
slug = 'main'
regex = "\\b(?:(?:experts|critics|observers|scholars|analysts|commentators) (?:have )?(?:widely )?(?:agree(?:d|ment)?|argue[ds]?|suggest(?:s|ed)?|believe[ds]?|note[ds]?|cite[ds]?|claim(?:s|ed)?|warn(?:s|ed)?|say|said|pointed out))\\b|\\bindustry (?:reports?|experts?|leaders?|insiders?) (?:have )?(?:widely )?(?:agree[sd]?|argue[ds]?|suggest(?:s|ed)?|warn(?:s|ed)?)\\b|\\bstudies (?:show|suggest|indicate|have shown)\\b|\\bresearch (?:shows|suggests|indicates|has shown)\\b\n"
advice = "Rewrite the construction plainly (wsc: Vague authority attribution (\"experts agree\", \"studies show\") without a named source is a documented AI weasel pattern (WP:AISIGNS))"

[group.fixtures]
must_match = ['Experts agree that the method works better than the control.']
must_not_match = ["Dr. Maria Lane, the study's lead author, agrees the sample was small."]
