[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "plugins/protocol", "plugins/sdk", "plugins/example-exclaim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# internal
deslop-core = { path = "crates/core" }
deslop-plugin-protocol = { path = "plugins/protocol" }

# CLI surface
clap = { version = "4", features = ["derive"] }

# serialization / data formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# text engines
regex = "1"
unicode-segmentation = "1.12"
pulldown-cmark = { version = "0.13", default-features = false }

# diagnostics rendering
codespan-reporting = "0.11"
termcolor = "1"

# error handling (see rust-programming skill: wherror derives + error_stack reports)
wherror = "2"
error-stack = "0.6"

# fs / paths
walkdir = "2"
camino = "1"
dirs = "6"

# dev
assert_cmd = "2"
tempfile = "3"
rstest = "0.25"

[profile.release]
lto = "thin"
strip = true
