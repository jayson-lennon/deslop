[package]
name = "deslop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core engine for deslop: dynamic TOML rules, markdown-aware scanning, findings"

[dependencies]
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
unicode-segmentation = { workspace = true }
pulldown-cmark = { workspace = true }
icu_segmenter = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
walkdir = { workspace = true }
camino = { workspace = true }
deslop-plugin-protocol = { workspace = true }
wasmi = "1.1"
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
sha2 = { workspace = true }

# CUDA acceleration for the embedding model (opt-in: `--features gpu`).
# Build-time cost is compiling candle's kernels with nvcc; default builds
# stay hermetic. cudarc loads the driver's libcuda at runtime.
[features]
gpu = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
wat = "1.258.0"
